name: Telegram Admin Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */4 * * *'   # 每4小时自动重启

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env
      run: |
        cat > .env << EOF
        BOT_TOKEN=${{ secrets.BOT_TOKEN }}
        SUPER_ADMINS=${{ secrets.SUPER_ADMINS }}
        PRIVATE_MODE=true
        EOF

    - name: Run Bot
      run: |
        nohup python -m bot.main > bot.log 2>&1 &
        sleep 240
